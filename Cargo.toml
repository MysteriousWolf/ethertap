[workspace]
members = [".", "xtask", "vst-runtime", "mock-suite", "midi-loopback"]
resolver = "2"

[package]
name = "ethertap"
version = "0.2.0"
edition = "2024"
description = "EtherTap – VST3 OSC bridge for Behringer X32 / Midas M32"

[lib]
name = "ethertap"
crate-type = ["cdylib", "rlib"]

[features]
standalone = ["nice-plug/standalone"]

[[bin]]
name = "ethertap-gui"
path = "src/bin/gui_test.rs"
required-features = ["standalone"]

[dependencies]
nice-plug = { git = "https://github.com/MysteriousWolf/nice-plug", branch = "ethertap", features = ["vst3"] }
nice-plug-iced = { git = "https://github.com/MysteriousWolf/nice-plug", branch = "ethertap" }
crossbeam-channel = "0.5"
rosc = "0.11"
parking_lot = "0.12"
log = "0.4"
if-addrs = "0.15"
midir = "0.11"
midi-loopback = { path = "midi-loopback" }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
serde_json = "1"
vst-runtime = { path = "vst-runtime" }
mock-suite = { path = "mock-suite" }

[[bench]]
name = "core"
harness = false

[target.'cfg(target_os = "macos")'.dependencies]
coremidi = "0.9"
core-foundation = "0.10"

[profile.release]
lto = "thin"
strip = "symbols"
opt-level = 3
